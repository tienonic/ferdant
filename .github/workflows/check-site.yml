name: Check Ferdant preview

on:
  push:
    branches: [main, 'website-preview-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate content and disabled commerce
        run: python scripts/check-content.py
      - name: Test dormant Shopify adapter without a store
        run: npm run test:commerce
      - name: Build preview and check generated files are current
        run: |
          python scripts/build.py
          git diff --exit-code
      - name: Prepare browser
        run: npx playwright install --with-deps chromium
      - name: Test reading, tools and invisible commerce
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/ferdant-preview.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:responsive
      - name: Save preview checks
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ferdant-preview-checks
          path: screenshots/
          retention-days: 14

# This workflow validates changes only. It has no cron, deployment, content-writing or commerce-activation step.
