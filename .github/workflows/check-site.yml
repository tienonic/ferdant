name: Check Ferdant site

on:
  push:
    branches: [main, 'firm-site-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build pages and check the committed files are current
        run: |
          python scripts/build.py --mode production --no-images
          git diff --exit-code
      - name: Check pages, links, apply links and banned words
        run: python scripts/check-site.py

# This workflow validates changes only. It has no cron or deployment step.
